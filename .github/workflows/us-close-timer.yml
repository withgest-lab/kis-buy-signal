name: 미국장 마감 타이머

# 미국 정규장 마감 직후(16:02 ET — 겨울 06:02 KST, 여름 05:02 KST) daily.yml을 바로 실행한다.
# GitHub 예약 실행은 몇 시간씩 밀린다(2026-11: daily.yml의 22:30 UTC 예약이 실제로는 02:00~04:45 UTC에 시작,
# 포털 배포의 2시간 간격 예약은 하루 3번꼴). 그래서 마감 몇 시간 전부터 여러 번 깨워 두고, 먼저 깨어난 타이머가
# 16:02 ET까지 기다렸다가 daily.yml을 실행한다. 늦게 깨어났으면 바로 실행하고, 이미 실행됐으면 그냥 끝낸다.
# 같은 저장소의 workflow_dispatch는 GITHUB_TOKEN으로도 새 실행을 만든다(비밀값 불필요). 공개 저장소라 대기 비용 없음.
# 종가 확정 대기(16:04 ET)·SPY 날짜 확인은 daily.yml의 signal_bot.wait_us_close가 맡는다.
on:
  schedule:
    # 평일(UTC) 12~20시 매시 13분 — 마감(겨울 21:00·여름 20:00 UTC) 5.5시간 안에 깨어난 것만 기다린다
    - cron: "13 12-20 * * 1-5"
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read

# 한 번에 하나만 기다린다. 뒤에 깨어난 타이머는 대기열에서 기다리다 '이미 실행됨'을 보고 끝난다.
concurrency:
  group: us-close-timer
  cancel-in-progress: false

jobs:
  timer:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Wait until 16:02 ET and start daily.yml once
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'EOF'
          import datetime as dt, json, os, subprocess, time, zoneinfo
          ny = zoneinfo.ZoneInfo("America/New_York")
          now = dt.datetime.now(ny)
          target = now.replace(hour=16, minute=2, second=0, microsecond=0)
          repo = os.environ["REPO"]

          def started_since(t):
              out = subprocess.run(["gh", "run", "list", "-R", repo, "--workflow", "daily.yml", "-L", "20",
                                    "--json", "createdAt"], check=True, capture_output=True, text=True).stdout
              return any(dt.datetime.fromisoformat(r["createdAt"].replace("Z", "+00:00")) >= t for r in json.loads(out))

          if now.weekday() >= 5:
              print(f"뉴욕 {now:%a} — 장 없는 날"); raise SystemExit
          wait = (target - now).total_seconds()
          if wait > 5.6 * 3600:
              print(f"뉴욕 {now:%H:%M} — 마감까지 {wait / 3600:.1f}시간, 나중에 깨어나는 타이머가 맡음"); raise SystemExit
          if started_since(target):
              print("오늘 마감 뒤 daily.yml이 이미 실행됨"); raise SystemExit
          if wait > 0:
              print(f"뉴욕 {now:%H:%M:%S} — 16:02 ET까지 {wait / 60:.0f}분 대기"); time.sleep(wait)
              if started_since(target):
                  print("기다리는 사이 daily.yml이 이미 실행됨"); raise SystemExit
          subprocess.run(["gh", "workflow", "run", "daily.yml", "-R", repo, "--ref", "main"], check=True)
          print(f"daily.yml 실행 요청 — 뉴욕 {dt.datetime.now(ny):%H:%M:%S}")
          EOF
